<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learnscape Camera Feed</title>
    <style>.camera-test-page .circle-camera-scan-board{width:min(74vw,68rem)}.camera-test-page .circle-camera-viewfinder{position:relative}.camera-test-page .camera-detection-overlay{pointer-events:none;width:100%;height:100%;position:absolute;inset:0}.camera-test-page .camera-feed-status{z-index:5;color:#fff;text-align:center;background:#122635d6;border:.14rem solid #ffffffe6;border-radius:999px;width:min(90vw,48rem);margin:0;padding:.65rem 1rem;font:800 clamp(.95rem,1.5vw,1.25rem)/1.2 Fredoka,Nunito,sans-serif;position:absolute;bottom:calc(2.5vh + 5rem);left:50%;transform:translate(-50%)}.camera-test-page .circle-camera-start-button{top:auto;bottom:2.5vh}@media (width<=700px){.camera-test-page .circle-camera-scan-board{width:92vw;height:72vh;padding:5rem .7rem .7rem;top:7%}.camera-test-page .circle-camera-scan-title{min-height:3.5rem;font-size:1.05rem}}</style>
  <script type="module" crossorigin src="/assets/cameraTest-BrN5a3mX.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/detectionManager-BfDLvuGG.js">
  <link rel="stylesheet" crossorigin href="/assets/main-Q6SIrJp_.css">
</head>
<body>
    <section class="circle-camera-page camera-test-page" aria-label="Camera game feed">
        <main class="circle-camera-scan-board">
            <div class="circle-camera-scan-title">
                <span class="circle-camera-icon" aria-hidden="true"></span>
                <strong>Scan an object using the camera!</strong>
            </div>
            <div class="circle-camera-viewfinder" aria-label="Live camera feed">
                <video id="webcam" class="circle-camera-video" autoplay playsinline muted></video>
                <canvas id="overlay" class="camera-detection-overlay" aria-hidden="true"></canvas>
                <span class="circle-camera-corner circle-camera-corner-tl"></span>
                <span class="circle-camera-corner circle-camera-corner-tr"></span>
                <span class="circle-camera-corner circle-camera-corner-bl"></span>
                <span class="circle-camera-corner circle-camera-corner-br"></span>
                <div class="circle-camera-scan-sweep" aria-hidden="true"></div>
            </div>
        </main>

        <p id="status" class="camera-feed-status" role="status" aria-live="polite">Press Start Camera to begin.</p>
        <button id="startButton" class="circle-camera-start-button" type="button">
            <span class="circle-camera-start-icon" aria-hidden="true"></span>
            <strong>Start Camera</strong>
        </button>
    </section>

</body>
</html>
