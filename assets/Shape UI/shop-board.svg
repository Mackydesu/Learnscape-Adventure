<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 790" role="img" aria-labelledby="title desc">
  <title id="title">Wooden adventure shop board</title>
  <desc id="desc">A bright carved wooden shop board with a cream display area, gold bolts, and green leaf decorations.</desc>
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9822b"/>
      <stop offset="0.48" stop-color="#a84d18"/>
      <stop offset="1" stop-color="#70300f"/>
    </linearGradient>
    <linearGradient id="woodLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2a54b"/>
      <stop offset="1" stop-color="#b85a1d"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7d7"/>
      <stop offset="1" stop-color="#efc775"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8ed32"/>
      <stop offset="0.52" stop-color="#35aa31"/>
      <stop offset="1" stop-color="#13702d"/>
    </linearGradient>
    <radialGradient id="bolt" cx="35%" cy="28%" r="72%">
      <stop offset="0" stop-color="#fff39b"/>
      <stop offset="0.28" stop-color="#ffc62f"/>
      <stop offset="1" stop-color="#a64c0b"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="9" flood-color="#3d1b09" flood-opacity=".42"/>
    </filter>
  </defs>

