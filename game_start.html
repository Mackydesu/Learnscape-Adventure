<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learnscape Adventure - Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="game-start-page">
    <img class="game-start-bg" src="assets/Backgrounds/bg1.png" alt="Learnscape game background">
    <a class="game-return-btn loading-link" href="learnscape_adventure.html" aria-label="Return to title screen">
        <span>‹</span>
        Back
    </a>
    <nav class="game-menu-bar" aria-label="Game menu">
        <button class="game-menu-btn" type="button">
            <span class="game-menu-icon" aria-hidden="true">⚙</span>
            Settings
        </button>
        <button class="game-menu-btn" type="button">
            <span class="game-menu-icon" aria-hidden="true">👤</span>
            Character
        </button>
        <button class="game-menu-btn" type="button">
            <span class="game-menu-icon" aria-hidden="true">🛒</span>
            Shop
        </button>
    </nav>
    <main class="game-start-stage" aria-label="Game selection">
        <section class="game-grid">
            <a class="game-card game-card-1 loading-link" href="game1.html" aria-label="Open Game 1">
                <div class="game-card-media">
                    <img class="game-card-image" src="assets/Backgrounds/Game1.png" alt="Game 1 preview">
                    <div class="game-card-overlay">
                        <h2 class="game-card-title">Alphabet Forest</h2>
                    </div>
                </div>
            </a>

            <a class="game-card game-card-2 loading-link" href="#" aria-label="Game 2">
                <div class="game-card-media">
                    <img class="game-card-image" src="assets/Backgrounds/Game2.png" alt="Game 2 preview">
                    <div class="game-card-overlay">
                        <h2 class="game-card-title">Math Meadow</h2>
                    </div>
                </div>
            </a>

            <div class="game-card game-card-3" aria-label="Game 3 coming soon">
                <div class="game-card-media game-card-placeholder">
                    <div class="game-card-overlay">
                        <h2 class="game-card-title">Coming Soon</h2>
                        <p class="game-card-copy">Reserved for your next quest</p>
                    </div>
                </div>
            </div>
        </section>
        <div class="game-start-prompt" aria-hidden="true">
            <span class="game-start-prompt-kicker">Choose a Game</span>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
